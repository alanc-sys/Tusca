server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: route-match-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rutatur_db?currentSchema=match_schema}
    username: ${SPRING_DATASOURCE_USERNAME:rutatur_match}
    password: ${SPRING_DATASOURCE_PASSWORD:rutatur_match}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: match_schema

rutatur:
  match:
    itinerary-base-url: ${RUTATUR_ITINERARY_BASE_URL:http://localhost:8082}
    keycloak-admin-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
    keycloak-realm: ${KEYCLOAK_REALM:rutatur-realm}
    keycloak-client-id: ${KEYCLOAK_MATCH_CLIENT_ID:rutatur-match}
    keycloak-client-secret: ${KEYCLOAK_MATCH_CLIENT_SECRET:rutatur-match-secret}
    share-ttl: 7d
    connect-timeout: 2s
    read-timeout: 3s
    match-threshold: 0.35
  internal-token: ${RUTATUR_INTERNAL_TOKEN:rutatur-dev-internal-token}
  security:
    jwt-issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/rutatur-realm}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
