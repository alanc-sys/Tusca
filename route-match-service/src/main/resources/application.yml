server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: route-match-service
  datasource:
    # route-match-service owns match_db: its own PostgreSQL container in Compose, its own
    # local instance/port in development. Tables live in the default `public` schema.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/match_db}
    username: ${SPRING_DATASOURCE_USERNAME:match_user}
    password: ${SPRING_DATASOURCE_PASSWORD:match_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

rutatur:
  match:
    itinerary-base-url: ${RUTATUR_ITINERARY_BASE_URL:http://localhost:8082}
    keycloak-admin-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
    keycloak-realm: ${KEYCLOAK_REALM:rutatur-realm}
    keycloak-client-id: ${KEYCLOAK_MATCH_CLIENT_ID:rutatur-match}
    keycloak-client-secret: ${KEYCLOAK_MATCH_CLIENT_SECRET}
    share-ttl: 7d
    connect-timeout: 2s
    read-timeout: 3s
    match-threshold: 0.35
  internal-token: ${RUTATUR_INTERNAL_TOKEN}
  security:
    jwt-issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/rutatur-realm}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false
        ignore-exceptions:
          - com.rutatur.common.exception.ResourceNotFoundException
          - com.rutatur.common.exception.BusinessException
          - com.rutatur.common.exception.ForbiddenActionException
    instances:
      itineraryService:
        base-config: default
      keycloak:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
