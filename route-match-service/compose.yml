services:
  route-match-service:
    build:
      context: ..
      dockerfile: route-match-service/Dockerfile
    container_name: rutatur-route-match-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/match_db
      MATCH_DB_USER: ${MATCH_DB_USER:-match_user}
      MATCH_DB_PASSWORD: ${MATCH_DB_PASSWORD:-changeme_match_db}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/rutatur}
      ITINERARY_SERVICE_URI: ${ITINERARY_SERVICE_URI:-http://itinerary-service:8082}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Falta INTERNAL_SERVICE_TOKEN en .env}
    ports:
      # Expuesto solo en loopback (acceso externo vía api-gateway:8080)
      - "127.0.0.1:${ROUTE_MATCH_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      itinerary-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - rutatur-network

networks:
  rutatur-network:
    name: rutatur-network
    driver: bridge
