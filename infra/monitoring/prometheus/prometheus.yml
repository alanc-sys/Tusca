global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway

  - job_name: poi-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["poi-service:8081"]
        labels:
          service: poi-service

  - job_name: itinerary-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["itinerary-service:8082"]
        labels:
          service: itinerary-service

  - job_name: route-match-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["route-match-service:8083"]
        labels:
          service: route-match-service
